services:
  lv2:
    image: mcr.microsoft.com/devcontainers/ruby:3.4-bookworm
    working_dir: /workspaces/lv2-rails
    command: bash -lc "bundle config set path vendor/bundle && bundle install && bin/rails db:migrate && bin/rails db:seed && bin/rails server -b 0.0.0.0 -p 3000"
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      RAILS_RELATIVE_URL_ROOT: /lv-2/example
    volumes:
      - .:/workspaces

  lv3:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm
    working_dir: /workspaces/lv3-fastapi
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      LV1_DIST_DIR: /workspaces/lv1-vue/dist
      LV2_ORIGIN: http://lv2:3000
    volumes:
      - .:/workspaces
    depends_on:
      - lv2
