# Dev Container Docker Compose Configuration for Ruby on Rails, Vue, and FastAPI
# This configuration has been optimized for reliability in automated and remote environments

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    privileged: true

    volumes:
      - ..:/workspaces:cached
      - ./commands:/commands
      - dind-var-lib-docker:/var/lib/docker
      - user_home:/root
      - ~/.ssh:/home/vscode/.ssh:ro

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

volumes:
  user_home:
  dind-var-lib-docker:
    # Keeps inner Docker images and containers across devcontainer restarts.
